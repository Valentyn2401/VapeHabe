<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кошик | VapeHop</title>
</head>
<body>
  <h1>Ваш кошик</h1>
  <nav>
    <ul>
      <li><a href="index.html">Головна</a></li>
      <li><a href="catalog.html">Каталог</a></li>
      <li><a href="cart.html">Кошик</a></li>
    </ul>
  </nav>
  <ul id="cart-items"></ul>
  <p id="total"></p>
  <button onclick="checkout()">Оформити замовлення</button>

  <script>
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const cartItems = document.getElementById('cart-items');
    let total = 0;

    cart.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item.name + ' - ' + item.price + ' грн';
      cartItems.appendChild(li);
      total += item.price;
    });

    document.getElementById('total').textContent = 'Загальна сума: ' + total + ' грн';

    function checkout() {
      if (cart.length === 0) {
        alert('Кошик порожній!');
        return;
      }
      alert('Замовлення оформлено. Дякуємо!');
      localStorage.removeItem('cart');
      location.reload();
    }
  </script>
</body>
</html>
